<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rexroth A4VSO Pump Schematic</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #151e32;
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 850px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
    }

    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent-cyan);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .svg-container {
      background: #070a12;
      border-radius: 8px;
      border: 1px solid #1e293b;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    input[type=range] {
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .legend {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>REXROTH A4VSO — SEE-THROUGH SCHEMATIC</h2>
    <span class="badge">Variable Displacement Swashplate Pump</span>
  </div>

  <div class="svg-container">
    <svg id="pumpSvg" viewBox="-250 -160 500 320">
      <!-- Grid lines for blueprint effect -->
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
        <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#475569" />
          <stop offset="50%" stop-color="#94a3b8" />
          <stop offset="100%" stop-color="#334155" />
        </linearGradient>
      </defs>

      <rect x="-250" y="-160" width="500" height="320" fill="url(#grid)" />

      <!-- Centerline axis -->
      <line x1="-230" y1="0" x2="230" y2="0" stroke="#334155" stroke-dasharray="6,4" stroke-width="1"/>

      <!-- Outer Pump Casing Outline -->
      <path d="M -210 -120 L 100 -120 L 170 -60 L 170 60 L 100 120 L -210 120 Z" 
            fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.4" />

      <!-- High Pressure Outlet Port (Top) -->
      <path d="M -40 -120 L -40 -140 L 20 -140 L 20 -120" fill="none" stroke="#ef4444" stroke-width="2"/>
      <text x="-10" y="-145" fill="#ef4444" font-size="10" font-family="monospace" text-anchor="middle">OUTLET (HP)</text>

      <!-- Low Pressure Inlet Port (Bottom) -->
      <path d="M -40 120 L -40 140 L 20 140 L 20 120" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <text x="-10" y="-155" transform="rotate(180)" fill="#3b82f6" font-size="10" font-family="monospace" text-anchor="middle">INLET (LP)</text>

      <!-- Drive Shaft -->
      <rect x="-230" y="-12" width="310" height="24" fill="url(#shaftGrad)" rx="2" stroke="#64748b" stroke-width="1"/>

      <!-- Rotating Cylinder Barrel Outline -->
      <rect x="-100" y="-85" width="120" height="170" fill="rgba(30, 41, 59, 0.5)" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
      <text x="-40" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">Cylinder Block</text>

      <!-- Valve Plate (Behind Cylinder Block) -->
      <rect x="-110" y="-85" width="10" height="170" fill="#475569" stroke="#94a3b8" stroke-width="1"/>

      <!-- Swashplate Group (Pivoting) -->
      <g id="swashplateGroup">
        <!-- Swashplate Body -->
        <rect x="-12" y="-95" width="24" height="190" fill="#334155" stroke="#f59e0b" stroke-width="2" rx="4"/>
        <line x1="0" y1="-95" x2="0" y2="95" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,2"/>
        <text x="35" y="5" fill="#f59e0b" font-size="10" text-anchor="start">Swashplate</text>
      </g>

      <!-- Dynamic Pistons & Flow render layer -->
      <g id="dynamicElements"></g>
    </svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:#ef4444"></div> High Pressure (Discharge)</div>
    <div class="legend-item"><div class="dot" style="background:#3b82f6"></div> Low Pressure (Suction)</div>
    <div class="legend-item"><div class="dot" style="background:#f59e0b"></div> Swashplate Control Angle</div>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="angleSlider">Swashplate Angle (Displacement): <span id="angleVal">15°</span></label>
      <input type="range" id="angleSlider" min="0" max="22" value="15" step="1">
    </div>
    <div class="control-group">
      <label for="speedSlider">Drive Shaft Speed (RPM): <span id="speedVal">1450</span></label>
      <input type="range" id="speedSlider" min="200" max="3000" value="1450" step="50">
    </div>
  </div>
</div>

<script>
  const dynamicLayer = document.getElementById('dynamicElements');
  const swashGroup = document.getElementById('swashplateGroup');
  const angleSlider = document.getElementById('angleSlider');
  const speedSlider = document.getElementById('speedSlider');
  const angleVal = document.getElementById('angleVal');
  const speedVal = document.getElementById('speedVal');

  const NUM_PISTONS = 9; // Standard Rexroth A4VSO piston count
  const PISTON_RADIUS = 58; // Radius of pistons arrangement circle
  const BARREL_X_END = 20;  // X coordinate where barrel ends
  const SWASH_CENTER_X = 80; // Pivot point X of swashplate

  let rotationAngle = 0;
  let lastTimestamp = 0;

  function render(timestamp) {
    if (!lastTimestamp) lastTimestamp = timestamp;
    const dt = (timestamp - lastTimestamp) / 1000;
    lastTimestamp = timestamp;

    const angleDeg = parseFloat(angleSlider.value);
    const rpm = parseFloat(speedSlider.value);
    
    angleVal.textContent = angleDeg + '°';
    speedVal.textContent = rpm;

    // Update swashplate rotation UI
    const angleRad = (angleDeg * Math.PI) / 180;
    swashGroup.setAttribute('transform', `translate(${SWASH_CENTER_X}, 0) rotate(${-angleDeg})`);

    // Increment barrel rotation based on RPM
    rotationAngle += (rpm * 360 / 60) * dt;
    rotationAngle %= 360;

    // Generate pistons dynamically
    let pistonsHTML = '';

    // Sort pistons by Z-depth for realistic overlapping/translucency
    const pistons = [];
    for (let i = 0; i < NUM_PISTONS; i++) {
      const pistonPhi = ((rotationAngle + (i * (360 / NUM_PISTONS))) * Math.PI) / 180;
      
      // 3D positioning on cylinder circle
      const y = PISTON_RADIUS * Math.sin(pistonPhi);
      const z = PISTON_RADIUS * Math.cos(pistonPhi); // Z-depth

      // Horizontal displacement caused by swashplate tilt
      const deltaX = -y * Math.tan(angleRad);
      const shoeX = SWASH_CENTER_X + deltaX;
      const headX = shoeX - 90; // Fixed length of piston shaft

      pistons.push({ id: i, y, z, headX, shoeX, phi: pistonPhi });
    }

    // Sort back-to-front
    pistons.sort((a, b) => a.z - b.z);

    pistons.forEach(p => {
      // Calculate opacity and scaling to simulate depth in a see-through render
      const depthFactor = (p.z + PISTON_RADIUS) / (2 * PISTON_RADIUS); // 0 to 1
      const opacity = 0.35 + (depthFactor * 0.65);
      const strokeWidth = 1 + (depthFactor * 1);

      // Color fluid based on stroke phase: top = outlet (red), bottom = inlet (blue)
      const fluidColor = p.y < 0 ? '#ef4444' : '#3b82f6';

      // Fluid chamber inside cylinder block bore
      const chamberWidth = Math.max(0, p.headX - (-100));
      pistonsHTML += `
        <!-- Fluid chamber in bore -->
        <rect x="-100" y="${p.y - 6}" width="${chamberWidth}" height="12" 
              fill="${fluidColor}" opacity="${opacity * 0.4}" rx="1"/>

        <!-- Cylinder Bore Outline -->
        <rect x="-100" y="${p.y - 8}" width="120" height="16" 
              fill="none" stroke="#334155" stroke-width="1" opacity="${opacity}"/>

        <!-- Piston Body -->
        <rect x="${p.headX}" y="${p.y - 6}" width="70" height="12" 
              fill="url(#shaftGrad)" stroke="#cbd5e1" stroke-width="${strokeWidth}" 
              opacity="${opacity}" rx="2"/>

        <!-- Slipper Pad / Swash Contact Joint -->
        <circle cx="${p.shoeX}" cy="${p.y}" r="5" 
                fill="#f59e0b" opacity="${opacity}"/>
      `;
    });

    dynamicLayer.innerHTML = pistonsHTML;

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
</script>
</body>
</html>
